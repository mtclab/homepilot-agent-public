# Monitoring Stack — Compose Overlay
# Usage: docker compose -f docker-compose.yml -f docker-compose.monitoring.yml up -d
#
# Adds Zabbix 7.0 monitoring to the HomePilot agent stack.
# 3 services: zabbix-server, zabbix-web, postgres
# Agent2 runs natively on VMs (apt install, not Docker).
#
# Prerequisites:
#   1. Copy .env.monitoring.example to .env.monitoring and fill in values
#   2. Create monitoring/zabbix/secrets/zabbix_pg_password.txt with your PG password
#   3. Run: docker compose -f docker-compose.yml -f docker-compose.monitoring.yml up -d
#   4. Access Zabbix UI at http://<host>:8084
#   5. Default login: Admin / zabbix (CHANGE IMMEDIATELY)

services:
  zabbix-postgres:
    image: postgres:16-alpine
    container_name: zabbix-postgres
    environment:
      POSTGRES_USER: ${ZBX_PG_USER:-zabbix}
      POSTGRES_PASSWORD_FILE: /run/secrets/zabbix_pg_password
      POSTGRES_DB: ${ZBX_PG_DB:-zabbix}
    volumes:
      - zabbix_pg_data:/var/lib/postgresql/data
    secrets:
      - zabbix_pg_password
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 512M
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${ZBX_PG_USER:-zabbix}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    networks:
      - monitoring-net

  zabbix-server:
    image: zabbix/zabbix-server-pgsql:7.0.26-ubuntu
    container_name: zabbix-server
    env_file:
      - .env.monitoring
    environment:
      DB_SERVER_HOST: zabbix-postgres
      DB_SERVER_PORT: "5432"
      POSTGRES_USER: ${ZBX_PG_USER:-zabbix}
      DB_SERVER_PASSWORD_FILE: /run/secrets/zabbix_pg_password
      POSTGRES_DB: ${ZBX_PG_DB:-zabbix}
      ZBX_ENABLE_SNMP_TRAPS: "false"
      ZBX_AUTOREGISTER_HOSTS: "1"
      ZBX_TLSCONNECT: psk
      ZBX_TLSCONNECTPSKIDENTITY: zabbix-server
    depends_on:
      zabbix-postgres:
        condition: service_healthy
    volumes:
      - zabbix_server_data:/var/lib/zabbix
      - ./monitoring/zabbix/alertscripts:/usr/lib/zabbix/alertscripts:ro
    ports:
      - "127.0.0.1:10051:10051"
    secrets:
      - zabbix_pg_password
      - zabbix_server_psk
      - zabbix_agent_psk
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 1G
    healthcheck:
      test: ["CMD-SHELL", "pgrep zabbix_server || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped
    networks:
      - monitoring-net
      - svc-net

  zabbix-web:
    image: zabbix/zabbix-web-nginx-pgsql:7.0.26-ubuntu
    container_name: zabbix-web
    environment:
      DB_SERVER_HOST: zabbix-postgres
      DB_SERVER_PORT: "5432"
      POSTGRES_USER: ${ZBX_PG_USER:-zabbix}
      POSTGRES_PASSWORD_FILE: /run/secrets/zabbix_pg_password
      POSTGRES_DB: ${ZBX_PG_DB:-zabbix}
      ZBX_SERVER_HOST: zabbix-server
      PHP_TZ: ${TZ:-Etc/UTC}
    depends_on:
      zabbix-server:
        condition: service_healthy
    ports:
      - "${ZBX_WEB_PORT:-8084}:8080"
    secrets:
      - zabbix_pg_password
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 512M
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    networks:
      - monitoring-net
      - svc-net

networks:
  monitoring-net:
    driver: bridge

volumes:
  zabbix_pg_data:
  zabbix_server_data:

secrets:
  zabbix_pg_password:
    file: ./monitoring/zabbix/secrets/zabbix_pg_password.txt
  zabbix_server_psk:
    file: ./monitoring/zabbix/secrets/zabbix_server_psk.txt
  zabbix_agent_psk:
    file: ./monitoring/zabbix/secrets/zabbix_agent_psk.txt