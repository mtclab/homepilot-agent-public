# TLS Reverse Proxy Overlay — Caddy
# Usage: docker compose -f docker-compose.yml -f docker-compose.monitoring.yml -f monitoring/caddy/docker-compose.tls.yml up -d
#
# Adds Caddy as TLS termination proxy for HomePilot, Zabbix, and n8n.
#
# Self-signed certs: bash monitoring/caddy/scripts/generate-self-signed-cert.sh
# Production certs:  Set DOMAIN env vars and Caddy auto-provisions via ACME.

services:
  caddy:
    image: caddy:2-alpine
    container_name: caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ../caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ../caddy/certs:/etc/caddy/certs:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - svc-net
      - monitoring-net
    environment:
      DOMAIN: ${DOMAIN:-homepilot.example.com}
      ZABBIX_DOMAIN: ${ZABBIX_DOMAIN:-zabbix.homepilot.example.com}
      N8N_DOMAIN: ${N8N_DOMAIN:-n8n.homepilot.example.com}
    healthcheck:
      test: ["CMD-SHELL", "caddy validate --config /etc/caddy/Caddyfile || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 256M
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  caddy_data:
  caddy_config: